<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Who’s In Today — Events first</title>
    <style>
        :root{color-scheme:light;font:15px/1.5 system-ui,sans-serif;color:#1d2826;background:#f1f2ed}
        *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #ad531f;outline-offset:3px}
        main{width:min(100% - 40px,451px);margin:42px auto 46px}h1,h2,h3,p{margin:0}h1{font:500 clamp(2.7rem,7vw,4.5rem)/1 Georgia,serif;letter-spacing:-.055em}
        header>p{margin-top:12px;color:#4b5853}
        .proposal{margin-top:28px;--surface:#fffdf8;--canvas:#faf9f2;--line:#d8ded3;--muted:#4f5d53;--accent:#204b3c;--soft:#e1ece3;--ink:#20312b}
        .proposal>h2{font-size:1.13rem}.proposal>p{color:#4b5853;font-size:.92rem;margin:3px 0 14px}
        .phone{height:650px;overflow:hidden;display:flex;flex-direction:column;border-radius:25px;background:var(--canvas);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 25px #20332c10}
        .app-bar{display:flex;justify-content:space-between;align-items:center;min-height:58px;padding:0 19px;border-bottom:1px solid var(--line);background:var(--surface);gap:8px;font-weight:750}
        .app-bar span{font-size:.85rem}.app-bar button,.text-button{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0}
        .screen{flex:1;overflow:auto;padding:19px;min-height:0}.screen h3{font:500 2.05rem/1.1 Georgia,serif;letter-spacing:-.035em}
        .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;color:var(--muted)}.count{color:var(--accent);font-size:.81rem;font-weight:750;padding:4px 9px;background:var(--soft);border-radius:99px;white-space:nowrap}
        .progress{height:5px;background:var(--line);border-radius:5px;margin:14px 0}.progress span{display:block;background:var(--accent);height:100%;border-radius:5px}
        .rows{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
        .rows li+li{border-top:1px solid var(--line)}.row,.event,.member{width:100%;min-height:51px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;text-align:left;border:0;background:none}
        .row{cursor:pointer}.row:has(:checked){background:var(--soft)}.row:focus-within{outline:2px solid var(--accent);outline-offset:-3px}.row input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin:0}.event:hover,.member:hover,.row:hover{box-shadow:inset 0 0 0 2px var(--accent)}
        .name{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere;font-weight:620}.initial{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:.69rem;font-weight:800}.row:has(:checked) .initial{background:var(--surface)}
        small,.muted{color:var(--muted)}.event strong{display:block}.event small{display:block;margin-top:2px}.arrow{font-size:1.45rem;color:var(--accent)}.actions{padding:10px 19px;background:var(--surface);border-top:1px solid var(--line)}.actions p{font-size:.78rem;color:var(--muted);margin:4px 0 0;text-align:center}
        .primary{display:block;width:100%;min-height:43px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:720;padding:9px}.primary:hover{filter:brightness(1.15)}
        .tabs{display:flex;justify-content:space-around;gap:4px;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px}.tabs button{border:0;background:none;border-radius:8px;padding:7px 10px;font-size:.85rem;color:var(--muted)}.tabs button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:750}
        form{margin-top:14px}form label{font-weight:650}form input{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px;margin:5px 0 12px}form p{margin:0 0 10px;font-size:.85rem;color:var(--muted)}.section-title{margin-top:20px;font-weight:720;font-size:.9rem}.preview-csv{white-space:pre;overflow:auto;background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:10px;font-size:.78rem}.screen>p{margin-top:8px}.status{font-size:.86rem;margin-top:8px;color:var(--accent);min-height:1.25em}
        @media(max-width:500px){main{width:min(100% - 28px,451px);margin-top:28px}}
    </style>
</head>
<body>
<main>
    <header>
        <h1>Who’s In Today</h1>
    </header>
    <section class="proposal">
        <h2>Events first</h2>
        <p>Open an event to record attendance, or use New event to add one.</p>
        <div id="events-mockup" class="phone" aria-label="Events first prototype"></div>
    </section>
</main>
<script>
    const sampleDate = '2026-11-18';
    const samples = ['Amélie Rey', 'Jonas Berger', 'Lea Imhof', 'Luca Morel', 'Mia Arnold', 'Noé Favre'];
    const shortDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'long' });
    const fullDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const html = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const csvCell = value => {
      const safe = /^[=+\-@\t\r\n]/.test(value) ? "'" + value : value;
      return /[",\r\n]/.test(safe) ? '"' + safe.replaceAll('"', '""') + '"' : safe;
    };
    function mount(root) {
      const prefix = 'events-';
      const members = samples.map((name, id) => ({name, id, active:true}));
      const snapshot = present => Object.fromEntries(members.filter(m => m.active).map(m => [m.id, present.includes(m.id)]));
      const events = [
        {date:sampleDate, closed:false, attendance:snapshot([0,2])},
        {date:'2026-11-04', closed:true, attendance:snapshot([0,1,3,5])},
        {date:'2026-10-21', closed:true, attendance:snapshot([0,1,2,4,5])}
      ];
      let page = 'events';
      let current = null;
      let editing = false;
      let memberId = null;
      let message = '';

      const sortedMembers = () => members.slice().sort((a,b) => a.name.localeCompare(b.name));
      const numbers = event => {
        const values = Object.values(event.attendance);
        return { present:values.filter(Boolean).length, total:values.length };
      };
      const csv = () => {
        const finished = events.filter(e => e.closed).sort((a,b) => a.date.localeCompare(b.date));
        const included = sortedMembers().filter(m => m.active || finished.some(e => m.id in e.attendance));
        return [['Name', ...finished.map(e => e.date)], ...included.map(m => [
          m.name, ...finished.map(e => m.id in e.attendance ? e.attendance[m.id] ? '1' : '0' : '')
        ])].map(row => row.map(csvCell).join(',')).join('\r\n');
      };
      const nav = (action, label, active) => '<button data-action="' + action + '"' + (active ? ' aria-current="page"' : '') + '>' + label + '</button>';
      const action = (command, label, hint = '') => '<button class="primary" data-action="' + command + '">' + label + '</button>' + (hint ? '<p>' + hint + '</p>' : '');
      const eventRow = event => {
        const {present,total} = numbers(event);
        return '<li><button class="event" data-action="open" data-date="' + event.date + '"><span><strong>' + fullDate(event.date) + '</strong><small>' + present + ' / ' + total + ' present</small></span>' +
          (event.closed ? '<span class="arrow" aria-hidden="true">›</span>' : '<span class="count">In progress</span>') + '</button></li>';
      };
      function render(focusId) {
        let body = '', footer = '';
        if (page === 'detail' && current) {
          const {present,total} = numbers(current);
          const canMark = !current.closed || editing;
          const labels = sortedMembers().filter(m => m.id in current.attendance).map(m => {
            const initials = html(m.name.split(/\s+/).slice(0,2).map(part => [...part][0]).join(''));
            const name = '<span class="name"><span aria-hidden="true" class="initial">' + initials + '</span>' + html(m.name) + '</span>';
            if (canMark) return '<li><label class="row">' + name + '<input id="' + prefix + 'check-' + m.id + '" type="checkbox" data-member="' + m.id + '"' + (current.attendance[m.id] ? ' checked' : '') + '></label></li>';
            return '<li><div class="row">' + name + '<small>' + (current.attendance[m.id] ? 'Present' : 'Absent') + '</small></div></li>';
          });
          body = '<h3>' + shortDate(current.date) + '</h3><div class="summary"><span>' + (editing ? 'Editing attendance' : current.closed ? 'Completed event' : 'Check in attendees') + '</span><span class="count" role="status">' + present + ' / ' + total + ' present</span></div><div class="progress" aria-hidden="true"><span style="width:' + (total ? 100 * present / total : 0) + '%"></span></div><ul class="rows">' + labels.join('') + '</ul>';
          footer = current.closed && !editing ? action('edit','Edit attendance') : action('finish', editing ? 'Done editing' : 'Finish check-in', current.closed ? 'Changes apply immediately.' : 'Unchecked members count as absent when you finish.');
        } else if (page === 'events') {
          const open = events.filter(e => !e.closed).sort((a,b) => b.date.localeCompare(a.date));
          const past = events.filter(e => e.closed).sort((a,b) => b.date.localeCompare(a.date));
          body = '<h3>Events</h3>' + (open.length ? '<div class="section-title">In progress</div><ul class="rows">' + open.map(eventRow).join('') + '</ul>' : '') +
            '<div class="section-title">Past events</div><ul class="rows">' + past.map(eventRow).join('') + '</ul>';
          footer = action('new','+ New event');
        } else if (page === 'new') {
          body = '<h3>New event</h3><form data-form="date"><label for="' + prefix + 'date">Event date</label><input type="date" id="' + prefix + 'date" name="date" required value="' + sampleDate + '"><p>Each date has one attendance record.</p><button class="primary">Start check-in</button><div class="status" role="status"></div></form>';
        } else if (page === 'people') {
          const member = members.find(m => m.id === memberId);
          body = '<h3>People</h3><form data-form="member"><label for="' + prefix + 'name">' + (member ? 'Edit name' : 'Add a member') + '</label><input id="' + prefix + 'name" name="name" required maxlength="100" value="' + (member ? html(member.name) : '') + '"><button class="primary">' + (member ? 'Save name' : 'Add member') + '</button><div class="status" role="status">' + html(message) + '</div></form>' +
            (member ? '<button class="text-button" data-action="toggle-member">' + (member.active ? 'Archive member' : 'Restore member') + '</button>' : '') +
            '<ul class="rows">' + sortedMembers().map(m => '<li><button class="member" data-action="person" data-id="' + m.id + '"><span class="name">' + html(m.name) + '</span><small>' + (m.active ? 'Edit' : 'Archived · Edit') + '</small></button></li>').join('') + '</ul>';
        } else {
          body = '<h3>Export attendance</h3><p class="muted">Completed events · 1 present · 0 absent · blank outside the event roster</p><pre class="preview-csv">' + html(csv()) + '</pre><div class="status" role="status">' + html(message) + '</div>';
          footer = action('download','Download sample CSV');
        }
        root.innerHTML = '<div class="app-bar"><span>Who’s In Today</span>' + (page === 'new' ? '<button data-action="events">← Events</button>' : '') + '</div>' +
          '<div class="screen">' + body + '</div>' + (footer ? '<div class="actions">' + footer + '</div>' : '') +
          '<nav class="tabs" aria-label="App navigation">' + nav('events','Events',page === 'events' || page === 'detail') + nav('people','People',page === 'people') + nav('export','Export',page === 'export') + '</nav>';
        if (focusId) document.getElementById(focusId)?.focus();
      }

      root.addEventListener('change', event => {
        const input = event.target;
        if (!input.matches('[data-member]')) return;
        current.attendance[input.dataset.member] = input.checked;
        const scroll = root.querySelector('.screen').scrollTop;
        render(input.id);
        root.querySelector('.screen').scrollTop = scroll;
      });
      root.addEventListener('submit', event => {
        const kind = event.target.dataset.form;
        if (!kind) return;
        event.preventDefault();
        const form = new FormData(event.target);
        const status = event.target.querySelector('.status');
        if (kind === 'date') {
          const date = form.get('date');
          const existing = events.find(e => e.date === date);
          if (!existing && !members.some(m => m.active)) {
            status.textContent = 'Add an active member before starting an event.';
            return;
          }
          current = existing ?? {date, closed:false, attendance:snapshot([])};
          if (!existing) events.push(current);
          page = 'detail';
        } else {
          const name = form.get('name').trim();
          if (!name) {
            status.textContent = 'Enter a name.';
            return;
          }
          const member = members.find(m => m.id === memberId);
          if (member) member.name = name;
          else members.push({ name, id:members.length, active:true });
          memberId = null;
          message = 'Member saved.';
        }
        editing = false;
        render();
      });
      root.addEventListener('click', event => {
        const button = event.target.closest('[data-action]');
        if (!button || !root.contains(button)) return;
        const command = button.dataset.action;
        message = '';
        switch(command) {
          case 'download': {
            const url = URL.createObjectURL(new Blob(['\uFEFF', csv(), '\r\n'], {type:'text/csv;charset=utf-8'}));
            const link = document.createElement('a');
            link.href = url;
            link.download = 'attendance-sample.csv';
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            return;
          }
          case 'open': current = events.find(e => e.date === button.dataset.date); page = 'detail'; break;
          case 'edit': editing = true; render(); return;
          case 'finish': current.closed = true; break;
          case 'people': memberId = null; page = command; break;
          case 'person': memberId = Number(button.dataset.id); break;
          case 'toggle-member': {
            const member = members.find(m => m.id === memberId);
            member.active = !member.active;
            memberId = null;
            message = member.active ? 'Member restored.' : 'Member archived.';
            break;
          }
          default: page = command;
        }
        editing = false;
        render();
      });
      render();
    }
    mount(document.getElementById('events-mockup'));
</script>
</body>
</html>
